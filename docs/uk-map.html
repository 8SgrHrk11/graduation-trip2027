<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>プレミアリーグ 本拠地マップ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
  html, body { margin:0; height:100%; background:#f5ead8; font-family:"Figtree","Zen Maru Gothic",system-ui,sans-serif; }
  #wrap { position:absolute; inset:0; }
  svg { display:block; width:100%; height:100%; }
  .cty { fill:#e6d7bd; stroke:#f5ead8; stroke-width:0.6; }
  .cty.hl { fill:#ccdbb2; }
  .dot { fill:none; stroke:#a19786; stroke-width:2.2; }
  .dot.on { fill:#c67139; stroke:#f5ead8; stroke-width:2.4; }
  .lbl { font-family:"Zen Maru Gothic",sans-serif; font-weight:700; font-size:11.5px; fill:#201e1d; paint-order:stroke;
         stroke:#f5ead8; stroke-width:3.5px; stroke-linejoin:round; }
  .num { font-family:"Figtree",sans-serif; font-weight:700; font-size:11px; fill:#8c491a; paint-order:stroke;
         stroke:#f5ead8; stroke-width:3.5px; stroke-linejoin:round; }
</style>
</head>
<body>
<div id="wrap"></div>
<script>
const CIRC = ["⓪","①","②","③","④","⑤","⑥","⑦","⑧","⑨","⑩"];
const PLACES = [
  { k:"LDN", n:"ロンドン",       c:[-0.13,51.51], opts:[1,3,9], dx:11,  dy:4 },
  { k:"BHT", n:"ブライトン",     c:[-0.14,50.82], opts:[2],     dx:11,  dy:10 },
  { k:"LIV", n:"リヴァプール",   c:[-2.99,53.41], opts:[4],     dx:-11, dy:2, anchor:"end" },
  { k:"LDS", n:"リーズ",         c:[-1.55,53.80], opts:[5],     dx:11,  dy:-4 },
  { k:"MAN", n:"マンチェスター", c:[-2.24,53.48], opts:[6],     dx:2,   dy:-13 },
  { k:"NTG", n:"ノッティンガム", c:[-1.15,52.95], opts:[7],     dx:11,  dy:6 },
  { k:"SUN", n:"サンダーランド", c:[-1.38,54.90], opts:[8],     dx:11,  dy:2 },
  { k:"BOU", n:"ボーンマス",     c:[-1.88,50.72], opts:[10],    dx:-11, dy:8, anchor:"end" }
];
let picks = [];
let land = null, svg, proj, path, g;

function size(){ const w = document.getElementById("wrap"); return [w.clientWidth||360, w.clientHeight||420]; }

function setup(){
  const [w,h] = size();
  d3.select("#wrap").selectAll("svg").remove();
  svg = d3.select("#wrap").append("svg").attr("viewBox",`0 0 ${w} ${h}`);
  proj = d3.geoMercator().fitExtent([[8,12],[w-8,h-12]], {
    type:"MultiPoint", coordinates:[[-6.2,50.1],[1.9,55.9]]
  });
  path = d3.geoPath(proj);
  g = svg.append("g");
  g.selectAll("path.cty").data(land.features).join("path")
   .attr("class", d => "cty" + (d.properties.name === "United Kingdom" ? " hl" : ""))
   .attr("d", path);
  svg.append("g").attr("class","layer");
  draw();
}

function draw(){
  const layer = svg.select(".layer");
  layer.selectAll("*").remove();
  PLACES.forEach(p => {
    const xy = proj(p.c);
    const on = p.opts.some(o => picks.indexOf(String(o)) >= 0);
    const grp = layer.append("g");
    grp.append("circle").attr("class","dot" + (on ? " on" : ""))
       .attr("cx",xy[0]).attr("cy",xy[1]).attr("r", on ? 7.5 : 5.5);
    const t = grp.append("text").attr("class","lbl")
       .attr("x", xy[0] + p.dx).attr("y", xy[1] + p.dy)
       .attr("text-anchor", p.anchor || "start");
    t.append("tspan").text(p.n);
    grp.append("text").attr("class","num")
       .attr("x", xy[0] + p.dx).attr("y", xy[1] + p.dy + 13)
       .attr("text-anchor", p.anchor || "start")
       .text(p.opts.map(o => CIRC[o]).join(""));
  });
}

d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json").then(topo => {
  land = topojson.feature(topo, topo.objects.countries);
  setup();
  window.addEventListener("resize", () => setup());
});
window.addEventListener("message", e => {
  const d = e.data || {};
  if (d.type === "setPicks") { picks = (d.picks || []).map(String); if (land) draw(); }
});
</script>
</body>
</html>
