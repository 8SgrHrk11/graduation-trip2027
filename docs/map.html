<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ルート地図</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
  html, body { margin:0; height:100%; background:#f5ead8; font-family:"Figtree","Zen Maru Gothic",system-ui,sans-serif; }
  #wrap { position:absolute; inset:0; }
  svg { display:block; width:100%; height:100%; }
  .cty { fill:#e6d7bd; stroke:#f5ead8; stroke-width:0.6; }
  .cty.hl { fill:#ccdbb2; }
  .route { fill:none; stroke:#c67139; stroke-width:2.6; stroke-linecap:round;
           stroke-dasharray:7 6; animation:march 1.4s linear infinite; }
  @keyframes march { to { stroke-dashoffset:-13; } }
  .dot { fill:#c67139; stroke:#f5ead8; stroke-width:2.4; }
  .dot.rome { fill:#56633f; }
  .lbl { font-family:"Zen Maru Gothic",sans-serif; font-weight:700; font-size:12px; fill:#201e1d; paint-order:stroke;
         stroke:#f5ead8; stroke-width:3.5px; stroke-linejoin:round; }
  .num { font-family:"Figtree",sans-serif; font-weight:700; font-size:9px; fill:#f5ead8; text-anchor:middle; }
</style>
</head>
<body>
<div id="wrap"></div>
<script>
const CITY = {
  ROM:{ n:"ローマ",   c:[12.50,41.90], dx:10,  dy:4 },
  MIL:{ n:"ミラノ",   c:[9.19,45.46],  dx:-8,  dy:-10, anchor:"end" },
  BCN:{ n:"バルセロナ",c:[2.17,41.39], dx:8,   dy:14 },
  LON:{ n:"ロンドン", c:[-0.13,51.51], dx:-9,  dy:-8, anchor:"end" },
  KRK:{ n:"クラクフ", c:[19.94,50.06], dx:10,  dy:4 },
  NCE:{ n:"ニース",   c:[7.26,43.70],  dx:9,   dy:13 },
  AMS:{ n:"アムステルダム", c:[4.90,52.37], dx:10, dy:-8 },
  OPO:{ n:"ポルト",   c:[-8.61,41.15], dx:-9,  dy:12, anchor:"end" },
  LIS:{ n:"リスボン", c:[-9.14,38.72], dx:-9,  dy:12, anchor:"end" },
  FRA:{ n:"フランクフルト", c:[8.68,50.11], dx:10, dy:-8 }
};
const ROUTES = {
  D:{ seq:["ROM","MIL","LIS","BCN","LON","ROM"], hl:["Italy","Portugal","Spain","United Kingdom"] }
};
let current = new URLSearchParams(location.search).get("route") || "D";
let land = null, svg, proj, path, g;

function size(){ const w = document.getElementById("wrap"); return [w.clientWidth||360, w.clientHeight||420]; }

function setup(){
  const [w,h] = size();
  d3.select("#wrap").selectAll("svg").remove();
  svg = d3.select("#wrap").append("svg").attr("viewBox",`0 0 ${w} ${h}`);
  proj = d3.geoMercator().fitExtent([[10,14],[w-10,h-14]], {
    type:"MultiPoint",
    coordinates:[[-11,36],[24,57.5]]
  });
  path = d3.geoPath(proj);
  g = svg.append("g");
  g.selectAll("path.cty").data(land.features).join("path").attr("class","cty").attr("d",path);
  svg.append("g").attr("class","layer");
  draw();
}

function draw(){
  const r = ROUTES[current];
  g.selectAll("path.cty").classed("hl", d => r.hl.includes(d.properties.name));
  const layer = svg.select(".layer");
  layer.selectAll("*").remove();
  const coords = r.seq.map(k => CITY[k].c);
  layer.append("path").attr("class","route")
       .attr("d", path({ type:"LineString", coordinates:coords }));
  const seen = [];
  r.seq.forEach((k,i) => {
    const first = !seen.includes(k); seen.push(k);
    const p = proj(CITY[k].c);
    const grp = layer.append("g");
    grp.append("circle").attr("class","dot"+(k==="ROM"?" rome":"")).attr("cx",p[0]).attr("cy",p[1]).attr("r",8.5);
    grp.append("text").attr("class","num").attr("x",p[0]).attr("y",p[1]+3.2).text(i+1);
    if (first) grp.append("text").attr("class","lbl")
      .attr("x",p[0]+(CITY[k].dx||8)).attr("y",p[1]+(CITY[k].dy||4))
      .attr("text-anchor",CITY[k].anchor||"start").text(CITY[k].n);
  });
}

d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json").then(topo => {
  land = topojson.feature(topo, topo.objects.countries);
  setup();
  window.addEventListener("resize", () => setup());
});
window.addEventListener("message", e => {
  const d = e.data || {};
  if (d.type === "setRoute" && ROUTES[d.route]) { current = d.route; if (land) draw(); }
});
</script>
</body>
</html>
